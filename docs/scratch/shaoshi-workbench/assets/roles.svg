<text x="1009" y="740" font-size="16" fill="#fff" class="">协调处理方案 →</text>
<text x="986" y="811" font-size="12" fill="#7b8577" class="">关联关注点：技术攻关、重点任务</text>
<text x="42" y="923" font-size="17" fill="#637a63" class="">岗位变化体现在阶段、材料、成果和动作；共同操作框架保持稳定。</text>
