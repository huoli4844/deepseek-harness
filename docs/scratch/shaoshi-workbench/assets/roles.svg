<text x="70" y="597" font-size="14" fill="#8a774d" class="">待核实：可调整的交付范围</text>
<text x="58" y="668" font-size="14" fill="#748270" class="">AI 围绕本岗位的材料与判断协作</text>
<rect x="58" y="708" width="396" height="50" rx="7" fill="#315f56" stroke="none"/>
