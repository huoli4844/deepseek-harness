<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img">
<title>同一工作在不同岗位下的界面重点</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:400} .title{font-weight:500}</style>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#f6f6f0" stroke="none"/>
<text x="42" y="61" font-size="30" fill="#303b3a" class="title">同一项工作，不同岗位的处理视角</text>
<text x="42" y="98" font-size="16" fill="#788073" class="">供应商来料异常 · 设计示例，非实际业务记录</text>
<text x="42" y="139" font-size="15" fill="#778274" class="">共同关联：业务对象 / 证据版本 / 工作记录    ·    权限仍由元枢判断</text>
