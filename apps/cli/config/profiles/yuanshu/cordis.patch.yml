- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  disabled: true

- id: yuanshu-login-server
  name: '@deepseek-ai/dsh-yuanshu-login-server'
  inject: [webServer, connection, webApp]
  config:
    yuanshuApiUrl: http://localhost:8081

- id: ui-yuanshu-chat
  name: '@deepseek-ai/dsh-client-ui-yuanshu-chat'

- id: yuanshu-gateway
  name: '@deepseek-ai/dsh-yuanshu-gateway'
  config:
    baseURL: http://localhost:8081
    prefix: /yuanshu-api

- id: yuanshu-tool
  name: '@deepseek-ai/dsh-yuanshu-tool'
  config:
    baseURL: http://localhost:8081
    defaultWorkerType: general_assistant

- id: yuanshu-qa-tool
  name: '@deepseek-ai/dsh-yuanshu-qa-tool'
  config:
    baseURL: http://localhost:8081
    streaming: false
