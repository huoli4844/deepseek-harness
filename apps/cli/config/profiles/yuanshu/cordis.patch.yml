# YuanShu platform integration overlay
# Connects deepseek-harness to local YuanShu server at http://localhost:8081

- id: yuanshu-gateway
  name: '@deepseek-ai/dsh-yuanshu-gateway'
  config:
    baseURL: http://localhost:8081
    prefix: /yuanshu-api

- id: yuanshu-tool
  name: '@deepseek-ai/dsh-yuanshu-tool'
  config:
    baseURL: http://localhost:8081
    defaultWorkerType: general_assistant
