# yuanshu-gateway, yuanshu-login-server and ui-yuanshu-chat are mounted by the
# @deepseek-ai/dsh-web-app bundle patch; mounting them here again would insert
# duplicate entries for the same ids.

- insert:
    - id: yuanshu-tool
      name: '@deepseek-ai/dsh-yuanshu-tool'
      config:
        baseURL: http://localhost:8081
        enterpriseTransport: mcp

    - id: yuanshu-qa-tool
      disabled: true
      name: '@deepseek-ai/dsh-yuanshu-qa-tool'
      config:
        baseURL: http://localhost:8081
        streaming: false
